<!-- ===== NOTIFICATION DRAWER (Dynamic) ===== -->

    <div class="bg-white w-full max-w-sm h-full p-6 shadow-2xl flex flex-col justify-between overflow-y-auto">

            </div>

                <!-- Rendered by JavaScript -->
            </div>
        </div>
        <div class="pt-4 border-t border-slate-100 flex flex-col gap-2">

        </div>
    </div>
</div>

<!-- ===== JAVASCRIPT (ES Module) ===== -->
<script type="module">
    // Import real students from data.js
    import { students } from './assets/js/data.js';

    // ===== Module list =====
    const modules = [
        { name: 'Dashboard', url: 'index.html' },
        { name: 'Approvals', url: 'approvals.html' },
        { name: 'Admissions', url: 'admissions.html' },
        { name: 'Academic Setup', url: 'manage.html' },
        { name: 'Enrollment', url: 'enrol.html' },
        { name: 'Graduation', url: 'graduation.html' },
        { name: 'TER', url: 'ter.html' },
        { name: 'Billing', url: 'billing.html' },
        { name: 'Registrar', url: 'registrar.html' },
        { name: 'Security', url: 'security.html' },
        { name: 'Academic Administration', url: 'academic.html' },
        { name: 'Settings', url: 'settings.html' }
    ];

    // ===== DOM refs =====
    const searchInput = document.getElementById('globalCommandSearch');
    const resultsContainer = document.getElementById('commandResults');

    // ===== Only proceed if elements exist =====
    if (searchInput && resultsContainer) {
        console.log(`[Header Search] Loaded ${students.length} students.`);

        // ===== Search function =====
        function performSearch(query) {
            const q = query.toLowerCase().trim();
            if (q.length === 0) {
                resultsContainer.classList.add('hidden');
                return;
            }

            const moduleMatches = modules.filter(m => m.name.toLowerCase().includes(q));
            const studentMatches = students.filter(s =>
                s.name.toLowerCase().includes(q) ||
                (s.id && s.id.toLowerCase().includes(q))
            );

            let html = '';

            if (moduleMatches.length) {
                html += `<div class="px-3 py-1.5 text-[10px] uppercase font-bold text-slate-500 tracking-wider">Modules</div>`;
                moduleMatches.forEach(m => {
                    html += `<a href="${m.url}" class="block px-4 py-2 hover:bg-slate-700 text-slate-200 text-sm">${m.name}</a>`;
                });
            }

            if (studentMatches.length) {
                html += `<div class="px-3 py-1.5 text-[10px] uppercase font-bold text-slate-500 tracking-wider mt-1">Students</div>`;
                studentMatches.forEach(s => {
                    const link = `student-360.html?student=${encodeURIComponent(s.id)}`;
                    html += `<a href="${link}" class="block px-4 py-2 hover:bg-slate-700 text-slate-200 text-sm">${s.name} <span class="text-slate-400 text-xs font-mono">${s.id}</span></a>`;
                });
            }

            if (!html) {
                html = `<div class="px-4 py-3 text-sm text-slate-400">No results found.</div>`;
            }

            resultsContainer.innerHTML = html;
            resultsContainer.classList.remove('hidden');
        }

        // ===== Event listeners =====
        searchInput.addEventListener('input', e => performSearch(e.target.value));
        searchInput.addEventListener('blur', () => {
            setTimeout(() => resultsContainer.classList.add('hidden'), 200);
        });
        searchInput.addEventListener('focus', function() {
            if (this.value.trim()) performSearch(this.value);
        });

        // ===== Keyboard shortcuts =====
        document.addEventListener('keydown', function(e) {
            if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
                e.preventDefault();
                searchInput.focus();
                searchInput.select();
            }
            if (e.key === '/' && !e.ctrlKey && !e.metaKey && document.activeElement.tagName !== 'INPUT') {
                e.preventDefault();
                searchInput.focus();
                searchInput.select();
            }
            if (e.key === 'Escape') {
                resultsContainer.classList.add('hidden');
                searchInput.blur();
            }
        });

        // ===== Close dropdown on outside click =====
        document.addEventListener('click', function(e) {
            const container = searchInput.closest('.relative');
            if (container && !container.contains(e.target)) {
                resultsContainer.classList.add('hidden');
            }
        });

        console.log('[Header Search] Initialized successfully.');
    } else {
        console.warn('[Header Search] Search elements not found.');
    }
</script>
