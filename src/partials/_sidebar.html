<!-- ===== SIDEBAR TOGGLE JAVASCRIPT ===== -->
<script>
    // ===== Sidebar Toggle (Desktop Collapse) =====
    (function () {
        const SIDEBAR_STATE_KEY = 'sidebar-collapsed';

        function getSidebarState() {
            return localStorage.getItem(SIDEBAR_STATE_KEY) === 'true';
        }

        function setSidebarState(collapsed) {
            localStorage.setItem(SIDEBAR_STATE_KEY, String(collapsed));
        }

        function applySidebarState(collapsed) {
            const sidebar = document.getElementById('mainSidebar');
            const toggleBtn = document.getElementById('sidebarToggleBtn');
            if (!sidebar) return;

            if (collapsed) {
                sidebar.classList.add('collapsed');
                if (toggleBtn) toggleBtn.setAttribute('aria-expanded', 'false');
            } else {
                sidebar.classList.remove('collapsed');
                if (toggleBtn) toggleBtn.setAttribute('aria-expanded', 'true');
            }
        }

        window.toggleSidebar = function () {
            const current = getSidebarState();
            const newState = !current;
            setSidebarState(newState);
            applySidebarState(newState);
        };

        // Initialize on DOM ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function () {
                const initialState = getSidebarState();
                applySidebarState(initialState);
            });
        } else {
            const initialState = getSidebarState();
            applySidebarState(initialState);
        }

        // Also handle window resize - if going to mobile, reset the collapsed state
        let resizeTimeout;
        window.addEventListener('resize', function () {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(function () {
                // If we're on mobile (lg breakpoint), the sidebar is hidden anyway
                // We don't need to do anything special
            }, 100);
        });
    })();

    // ===== Sidebar Active State (Enhanced) =====
    // The existing active state logic in _layout.html already handles this.
    // We're adding a class to the icon for collapsed mode.
    // The existing pageMap logic will still work, but we're adding
    // an additional class for the collapsed state.

    // Override the setActiveSidebar function in _layout.html to handle collapsed state
    // This is a patch - the main logic is in _layout.html
    if (typeof setActiveSidebar === 'function') {
        const originalSetActive = setActiveSidebar;
        setActiveSidebar = function () {
            originalSetActive();
            // After setting active, also mark the icon
            document.querySelectorAll('#mainSidebar .nav-item.active .sidebar-icon').forEach(icon => {
                icon.classList.add('text-brand-400');
            });
        };
    }
</script>
